name: Daily product research
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *' # 07:50 Asia/Kolkata (UTC+5:30)
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect public product signals
        run: python research.py
      - name: Commit latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest_products.csv reports/latest_status.json reports/daily_products_*.csv
          git diff --cached --quiet || git commit -m "Update daily product research report"
          git push
